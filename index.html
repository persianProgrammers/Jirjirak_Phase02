<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جیرجیرک - Jirjirak</title>
    <meta name="description" content="پلتفرم آموزشی جیرجیرک - نسخه لندینگ و هیرو" />
    <meta property="og:title" content="جیرجیرک - Jirjirak" />
    <meta property="og:description" content="پلتفرم آموزشی جیرجیرک - نسخه لندینگ و هیرو" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Universal Interactive Cursor Pointer Policy */
      a,
      a *,
      button,
      button *,
      [role="button"],
      [role="button"] *,
      [role="tab"],
      [role="tab"] *,
      [role="link"],
      [role="link"] *,
      [role="switch"],
      [role="switch"] *,
      [role="menuitem"],
      [role="menuitem"] *,
      .cursor-pointer,
      .cursor-pointer *,
      [data-cursor="pointer"],
      [data-cursor="pointer"] *,
      input[type="button"],
      input[type="submit"],
      input[type="reset"],
      input[type="checkbox"],
      input[type="radio"],
      select,
      summary,
      label,
      #Jirjirak_Header_Logo,
      #Jirjirak_Header_Logo *,
      #Jirjirak_Footer_Logo,
      #Jirjirak_Footer_Logo *,
      header a,
      header a *,
      header button,
      header button *,
      nav a,
      nav a *,
      nav button,
      nav button *,
      footer a,
      footer a *,
      footer button,
      footer button * {
        cursor: pointer !important;
      }

      button:disabled,
      button:disabled *,
      [aria-disabled="true"],
      [aria-disabled="true"] * {
        cursor: not-allowed !important;
      }

      .cursor-grab {
        cursor: grab !important;
      }
      .cursor-grabbing,
      .cursor-grabbing * {
        cursor: grabbing !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
